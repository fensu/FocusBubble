name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows portable (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # --no-bundle: 只编译 exe，不生成 NSIS/MSI 安装包（不写注册表、免安装）
      - name: Build portable executable
        run: npx tauri build --no-bundle

      - name: Package portable zip
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/focus-bubble.exe"
          if (-not (Test-Path $exe)) { throw "executable not found: $exe" }
          Compress-Archive -Path $exe -DestinationPath FocusBubble-windows-x64-portable.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusBubble-windows-x64-portable
          path: FocusBubble-windows-x64-portable.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: FocusBubble-windows-x64-portable.zip

  build-macos:
    name: macOS universal (dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build universal dmg
        run: npx tauri build --target universal-apple-darwin

      - name: Collect dmg
        run: |
          mkdir -p artifacts
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusBubble-macos-universal
          path: artifacts/*.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.dmg
